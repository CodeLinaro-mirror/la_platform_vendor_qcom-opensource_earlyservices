# Simple configure file for early-init program
# NOTE: Keep splash app as first entry to ensure display
[esplash]
cmd=/vendor_early_services/vendor/bin/esplash
pidfile=/vendor_early_services/run/early/esplash.pid
log=/vendor_early_services/run/esplash.txt
group=system
<end>

[audio-nxp-auto]
cmd=/vendor_early_services/vendor/bin/audio-nxp-auto
env=/vendor_early_services:/vendor_early_services/system:/vendor_early_services/system/lib64:/vendor_early_services/system/bin
pidfile=/vendor_early_services/run/early/audio-nxp-auto.pid
log=/vendor_early_services/run/audio-nxp-auto.txt
<end>

[ais_server]
cmd=/vendor_early_services/vendor/bin/ais_server
env=/vendor_early_services:/vendor_early_services/system:/vendor_early_services/system/lib64:/vendor_early_services/system/lib
pidfile=/vendor_early_services/run/early/ais_server.pid
log=/vendor_early_services/run/ais_server.txt
<end>

#early_video_app arguments
#-i is eqaul to --input, no default value, required
#-c is eqaul to --config, no default value, required, data frames read length(decimal) table file
#-d is eqaul to --displaycard, no default value, required
#-t is eqaul to --logtag, default is Early_Video_APP:, optinal
#-l is eqaul to --loglevel, default is 3, optinal
[early_video_primary]
cmd=/vendor_early_services/system/bin/early_video_app
argv=-i/vendor_early_services/vendor/data/early_video/primary.h264
argv=-c/vendor_early_services/vendor/data/early_video/primary.config
argv=-d/dev/dri/card5
argv=-tEarly_video_APP_Primary:
argv=-l3
env=/vendor_early_services:/vendor_early_services/system:/vendor_early_services/system/lib64:/vendor_early_services/system/bin/bootstrap
pidfile=/vendor_early_services/run/EarlyVideoApp/VideoDecoder/early_video_primary.pid
log=/vendor_early_services/run/EarlyVideoApp/VideoDecoder/early_video_primary.txt
group=system
<end>

#early_video_app arguments
