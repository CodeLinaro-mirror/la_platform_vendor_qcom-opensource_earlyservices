# Simple configure file for early-init program
# NOTE: Keep splash app as first entry to ensure display
[esplash]
cmd=/vendor_early_services/vendor/bin/esplash
pidfile=/vendor_early_services/run/early/esplash.pid
log=/vendor_early_services/run/esplash.txt
group=system
<end>

[audio-nxp-auto]
cmd=/vendor_early_services/vendor/bin/audio-nxp-auto
env=/vendor_early_services:/vendor_early_services/system:/vendor_early_services/system/lib64:/vendor_early_services/system/bin
pidfile=/vendor_early_services/run/early/audio-nxp-auto.pid
log=/vendor_early_services/run/audio-nxp-auto.txt
<end>

